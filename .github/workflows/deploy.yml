name: Mareema - Deploy Mawred Rezq

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mareema
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Website + Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل ملفات المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. استخراج الموقع من ZIP
      - name: Extract website
        shell: bash
        run: |
          set -e

          rm -rf mareema-site
          mkdir -p mareema-site

          unzip -q mawred-reze9-FIXED.zip -d mareema-site

          # إذا كان داخل ZIP مجلد رئيسي
          if [ ! -f mareema-site/index.html ]; then
            DIR=$(find mareema-site -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$DIR" ] && [ -f "$DIR/index.html" ]; then
              cp -a "$DIR"/. mareema-site/
            fi
          fi

          # التأكد من وجود الموقع
          if [ ! -f mareema-site/index.html ]; then
            echo "ERROR: index.html not found."
            find mareema-site -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Website extracted successfully."

      # 3. تجهيز Java
      - name: Setup Java
        if: ${{ hashFiles('mareema-site/android/**') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. بناء APK موقّع Debug
      - name: Build Android APK
        if: ${{ hashFiles('mareema-site/android/**') != '' }}
        working-directory: mareema-site/android
        shell: bash
        run: |
          set -e

          echo "Preparing Android build..."

          # إنشاء Gradle Wrapper
          gradle wrapper --gradle-version 8.7

          echo "Building signed Debug APK..."

          ./gradlew assembleDebug

          echo "Searching for generated APK..."

          APK_FILE="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Debug APK was not generated."

            echo "Available build files:"
            find app/build/outputs -type f 2>/dev/null || true

            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK_FILE"

          # نسخ APK إلى مجلد الموقع
          cp "$APK_FILE" ../mawred-reze9.apk

          if [ ! -f ../mawred-reze9.apk ]; then
            echo "ERROR: APK copy failed."
            exit 1
          fi

          echo "APK ready:"
          ls -lh ../mawred-reze9.apk

      # 5. إضافة زر تحميل التطبيق
      - name: Add APK download button
        shell: bash
        run: |
          set -e

          if [ -f mareema-site/mawred-reze9.apk ]; then

            echo "APK detected."

            python3 <<'PY'
          from pathlib import Path

          p = Path("mareema-site/index.html")
          s = p.read_text(encoding="utf-8")

          if 'id="app-download-button"' not in s:

              button = '''
          <a id="app-download-button"
             href="mawred-reze9.apk"
             download
             style="
             position:fixed;
             right:16px;
             bottom:16px;
             z-index:99999;
             display:flex;
             align-items:center;
             gap:8px;
             padding:12px 18px;
             border-radius:999px;
             background:#111827;
             color:#ffffff;
             text-decoration:none;
             font-weight:700;
             box-shadow:0 8px 24px rgba(0,0,0,.25);
             ">
             📱 تحميل التطبيق
          </a>
          '''

              if "</body>" in s:
                  s = s.replace("</body>", button + "\n</body>")
              else:
                  s += button

              p.write_text(s, encoding="utf-8")

              print("Download button added.")

          else:
              echo = "APK not found. Button was not added."
              print(echo)

          PY

          else
            echo "WARNING: APK not found."
          fi

      # 6. التأكد النهائي من APK
      - name: Verify APK
        shell: bash
        run: |
          if [ -f mareema-site/mawred-reze9.apk ]; then
            echo "======================================"
            echo "APK READY FOR DOWNLOAD"
            echo "======================================"
            ls -lh mareema-site/mawred-reze9.apk
          else
            echo "WARNING: APK is not available."
          fi

      # 7. إعداد GitHub Pages
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 8. رفع الموقع
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: mareema-site

      # 9. نشر الموقع
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
