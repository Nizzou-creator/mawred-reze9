name: Unzip uploaded zip files

on:
  push:
    branches: [main]
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip every zip file found in the repo
        run: |
          shopt -s nullglob globstar
          found=0
          for z in **/*.zip; do
            found=1
            echo "Unzipping $z"
            tmp=$(mktemp -d)
            unzip -o -q "$z" -d "$tmp"
            entries=("$tmp"/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            else
              src="$tmp"
            fi
            cp -a "$src"/. "$(dirname "$z")"/
            git rm -q -f "$z"
            rm -rf "$tmp"
          done
          if [ "$found" -eq 0 ]; then echo "No zip file found."; fi

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Auto-unzip uploaded zip"
            git push
          fi
