name: Mareema - Deploy Mawred Rezq

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mareema
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Mareema
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract website
        run: |
          set -e

          rm -rf mareema-site
          mkdir mareema-site

          unzip -q mawred-reze9-FIXED.zip -d mareema-site

          if [ ! -f mareema-site/index.html ]; then
            DIR=$(find mareema-site -mindepth 1 -maxdepth 1 -type d | head -n 1)

            if [ -n "$DIR" ] && [ -f "$DIR/index.html" ]; then
              cp -a "$DIR"/. mareema-site/
            fi
          fi

          test -f mareema-site/index.html

          echo "Mareema website ready."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: mareema-site

      - name: Deploy website
        uses: actions/deploy-pages@v4
