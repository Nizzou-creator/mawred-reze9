name: Deploy Mawred Reze9

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select NEW website ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="./mawred-reze9-notifications-fix.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo "Upload the new ZIP with this exact name."
            exit 1
          fi

          echo "Using $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract website ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted dist
          mkdir -p extracted dist

          unzip -q "${{ steps.zip.outputs.ZIP_FILE }}" -d extracted

          INDEX="$(find extracted -type f -name 'index.html' | head -n 1)"

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi

          SITE_DIR="$(dirname "$INDEX")"

          cp -R "$SITE_DIR"/. dist/

      - name: Verify NEW notification build
        shell: bash
        run: |
          set -e

          test -f dist/index.html
          test -f dist/app.js
          test -f dist/config.js

          if ! grep -q "notification-item" dist/app.js; then
            echo "ERROR: notification code missing."
            exit 1
          fi

          echo "NEW notification build detected."

      - name: Bust browser cache
        shell: bash
        run: |
          set -e

          SHA="${GITHUB_SHA}"

          sed -i "s#app.js#app.js?v=$SHA#g" dist/index.html
          sed -i "s#style.css#style.css?v=$SHA#g" dist/index.html

          echo "Cache-busting version: $SHA"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
