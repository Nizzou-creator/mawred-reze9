name: Unzip uploaded zip files

on:
  push:
    branches:
      - main
    paths:
      - "**.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip uploaded ZIP files
        shell: bash
        run: |
          set -e

          shopt -s nullglob globstar

          found=0

          for z in **/*.zip; do
            found=1

            echo "========================================"
            echo "Processing ZIP: $z"
            echo "========================================"

            zip_dir="$(dirname "$z")"
            tmp="$(mktemp -d)"

            unzip -o -q "$z" -d "$tmp"

            entries=("$tmp"/*)

            if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            else
              src="$tmp"
            fi

            echo "Copying files to: $zip_dir"

            rsync -a \
              --exclude='.github/' \
              "$src"/ "$zip_dir"/

            git rm -f "$z"

            rm -rf "$tmp"

            echo "ZIP extracted successfully."
          done

          if [ "$found" -eq 0 ]; then
            echo "No ZIP file found."
          fi

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Auto-unzip uploaded ZIP"
            git push
          fi
