name: Deploy MREMMA from ZIP

on:
  push:
    branches:
      - main
    paths:
      - "mawred-reze9-FIXED.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP to temporary site
        shell: bash
        run: |
          set -e

          echo "Extracting website..."

          rm -rf site
          mkdir -p site

          unzip -q "mawred-reze9-FIXED.zip" -d site

          if [ ! -f "site/index.html" ]; then
            first_dir="$(find site -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"

            if [ -n "$first_dir" ] && [ -f "$first_dir/index.html" ]; then
              cp -a "$first_dir"/. site/
            fi
          fi

          test -f "site/index.html"

          echo "Website extracted successfully."

      - name: Fix Account button
        shell: bash
        run: |
          set -e

          if [ -f "site/app.js" ] && grep -q "function handleAccount" site/app.js; then

            python3 - <<'PY'
from pathlib import Path

p = Path("site/app.js")
s = p.read_text(encoding="utf-8")

if "window.handleAccount = handleAccount" not in s:

    needle = '$(\"#accountTop\")?.addEventListener(\"click\",handleAccount);'

    if needle in s:
        s = s.replace(
            needle,
            'window.handleAccount = handleAccount;\n' + needle,
            1
        )
    else:
        s += '\nwindow.handleAccount = handleAccount;\n'

    p.write_text(s, encoding="utf-8")

    print("Account button fix applied.")
else:
    print("Account button fix already exists.")
PY

          else
            echo "handleAccount not found."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
