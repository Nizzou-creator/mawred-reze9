name: Mareema - Deploy Mawred Rezq

'on':
  push:
    branches:
      - main
    paths:
      - "mawred-reze9-FIXED.zip"
      - ".github/workflows/mareema-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mareema-pages
  cancel-in-progress: true

jobs:
  mareema-deploy:
    name: Mareema - Deploy Mawred Rezq
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP to temporary Mareema site
        shell: bash
        run: |
          set -e

          echo "Starting Mareema deployment..."

          rm -rf mareema-site
          mkdir -p mareema-site

          unzip -q "mawred-reze9-FIXED.zip" -d mareema-site

          if [ ! -f "mareema-site/index.html" ]; then
            first_dir="$(find mareema-site -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"

            if [ -n "$first_dir" ] && [ -f "$first_dir/index.html" ]; then
              cp -a "$first_dir"/. mareema-site/
            fi
          fi

          test -f "mareema-site/index.html"

          echo "Mareema website extracted successfully."

      - name: Fix Mareema Account button
        shell: bash
        run: |
          set -e

          if [ -f "mareema-site/app.js" ] && grep -q "function handleAccount" mareema-site/app.js; then

            python3 - <<'PY'
from pathlib import Path

p = Path("mareema-site/app.js")
s = p.read_text(encoding="utf-8")

if "window.handleAccount = handleAccount" not in s:

    needle = '$(\"#accountTop\")?.addEventListener(\"click\",handleAccount);'

    if needle in s:
        s = s.replace(
            needle,
            'window.handleAccount = handleAccount;\n' + needle,
            1
        )
    else:
        s += '\nwindow.handleAccount = handleAccount;\n'

    p.write_text(s, encoding="utf-8")

    print("Mareema Account fix applied.")

else:
    print("Mareema Account fix already exists.")
PY

          else
            echo "handleAccount not found; continuing."
          fi

      - name: Configure Mareema Pages
        uses: actions/configure-pages@v5

      - name: Upload Mareema Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./mareema-site

      - name: Deploy Mareema Pages
        id: deployment
        uses: actions/deploy-pages@v4
